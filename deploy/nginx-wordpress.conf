server {
    server_name autonomiadigitalcv.com www.autonomiadigitalcv.com;
    client_max_body_size 20M;

    # --- Cabecalhos de seguranca (adicionados 18/09/2026) ---
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/html/wordpress;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/autonomiadigitalcv.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/autonomiadigitalcv.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.autonomiadigitalcv.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = autonomiadigitalcv.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name autonomiadigitalcv.com www.autonomiadigitalcv.com;
    return 404; # managed by Certbot




}
