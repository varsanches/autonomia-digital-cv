<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O site em números · Autonomia Digital CV</title>
<style>
  :root{ --navy:#1b2436; --acc:#e8912b; --azul:#eaf4fb; --mute:#7a8699; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Calibri,Arial,sans-serif;color:var(--navy);background:var(--azul);}
  .cab{background:var(--navy);color:#fff;padding:20px 22px;}
  .cab h1{font-size:1.25rem;font-weight:800;}
  .cab p{color:#cfd6e2;font-size:.9rem;margin-top:3px;}
  .env{max-width:1100px;margin:20px auto;padding:0 16px;}
  .wrap{position:relative;padding-top:62.25%;background:#fff;border-radius:10px;overflow:hidden;
        box-shadow:0 8px 24px rgba(31,42,68,.12);}
  .wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .nota{color:var(--mute);font-size:.85rem;margin:12px 4px;}
</style>
</head>
<body>
  <div class="cab">
    <h1>Autonomia Digital CV — O site em números</h1>
    <p>Painel de atividade do site, atualizado a partir dos dados reais (Power BI).</p>
  </div>
  <div class="env">
    <div class="wrap">
      <iframe title="Dashboard Autonomia Digital CV"
        src="https://app.powerbi.com/view?r=eyJrIjoiNGVhZjhhZGYtNjQ3ZS00ZTM0LTkxMDYtODNmNDU3OWU0Yzk0IiwidCI6IjdiNWNiZGU0LTI2N2YtNDVmOS05ZWYyLThlOTZmNTViNWFkMSIsImMiOjl9"
        frameborder="0" allowFullScreen="true"></iframe>
    </div>
    <p class="nota">Se o painel demorar a aparecer, aguarda uns segundos ou recarrega a página.</p>
  </div>
</body>
</html>
